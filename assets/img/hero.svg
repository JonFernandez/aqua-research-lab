<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440">
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="558" height="438" rx="4"/></clipPath>
    <path id="c" d="M-170 20 C -150 -80, -30 -110, 50 -90 S 190 -30, 160 40 S 10 120, -70 100 S -190 80, -170 20Z"/>
  </defs>
  <rect x="1" y="1" width="558" height="438" rx="4" fill="#fffdf8" stroke="#d3cab9"/>
  <g clip-path="url(#frame)">
    <!-- faint 10 m pixel grid -->
    <g stroke="#0e1b2c" stroke-opacity="0.07" stroke-width="1">
      <path d="M40 0V440M80 0V440M120 0V440M160 0V440M200 0V440M240 0V440M280 0V440M320 0V440M360 0V440M400 0V440M440 0V440M480 0V440M520 0V440"/>
      <path d="M0 40H560M0 80H560M0 120H560M0 160H560M0 200H560M0 240H560M0 280H560M0 320H560M0 360H560M0 400H560"/>
    </g>
    <!-- contour lines (generic terrain, not a real place) -->
    <g transform="translate(290 270)" fill="none" stroke="#0b6466" vector-effect="non-scaling-stroke">
      <use href="#c" transform="scale(1.55)" stroke-opacity="0.18" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
      <use href="#c" transform="scale(1.3)" stroke-opacity="0.26" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
      <use href="#c" transform="scale(1.05)" stroke-opacity="0.36" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
      <use href="#c" transform="scale(0.8)" stroke-opacity="0.5" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
      <use href="#c" transform="scale(0.56)" stroke-opacity="0.66" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      <use href="#c" transform="scale(0.33)" stroke-opacity="0.85" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    </g>
    <!-- river -->
    <path d="M0 395 C 70 380, 110 405, 170 392 S 260 360, 300 400 S 420 430, 560 410" fill="none" stroke="#0b6466" stroke-width="3" stroke-opacity="0.55" stroke-linecap="round"/>
    <!-- satellite ground track -->
    <path d="M560 -10 L 150 450" stroke="#0e1b2c" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 7"/>
    <!-- swath to plot -->
    <path d="M452 92 L 312 240 L 368 256 Z" fill="#0b6466" fill-opacity="0.08" stroke="#0b6466" stroke-opacity="0.45" stroke-width="1"/>
    <!-- field plot: a 2 x 2 block of 10 m cells -->
    <rect x="320" y="200" width="40" height="40" fill="#f3e3c6" stroke="#8a5410" stroke-width="2.5"/>
    <path d="M340 200V240M320 220H360" stroke="#8a5410" stroke-width="1.2"/>
    <!-- satellite -->
    <g transform="translate(470 74) rotate(-48)">
      <rect x="-9" y="-12" width="18" height="24" rx="2" fill="#0e1b2c"/>
      <rect x="-40" y="-6" width="26" height="12" fill="none" stroke="#0e1b2c" stroke-width="2"/>
      <rect x="14" y="-6" width="26" height="12" fill="none" stroke="#0e1b2c" stroke-width="2"/>
      <path d="M-14 0H-9M9 0H14M-27 -6V6M27 -6V6" stroke="#0e1b2c" stroke-width="2"/>
    </g>
  </g>
</svg>
