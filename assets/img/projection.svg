<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" font-family="Iowan Old Style, Charter, Georgia, serif">
  <rect x="1" y="1" width="558" height="438" rx="4" fill="#fffdf8" stroke="#d3cab9"/>
  <!-- faint grid -->
  <g stroke="#0e1b2c" stroke-opacity="0.06">
    <path d="M50 0V440M90 0V440M130 0V440M170 0V440M210 0V440M250 0V440M290 0V440M330 0V440M370 0V440M410 0V440M450 0V440M490 0V440M530 0V440"/>
    <path d="M0 60H560M0 100H560M0 140H560M0 180H560M0 220H560M0 260H560M0 300H560M0 340H560M0 380H560M0 420H560"/>
  </g>
  <!-- question A axes (ink) -->
  <g stroke="#0e1b2c" stroke-width="1.6">
    <path d="M250 300 H 480"/>
    <path d="M250 300 V 70"/>
  </g>
  <text x="488" y="305" font-size="20" fill="#0e1b2c">A</text>
  <!-- question B axes (rotated, slate) -->
  <g stroke="#33445a" stroke-width="1.6" stroke-dasharray="7 5">
    <path d="M250 300 L 438 168"/>
    <path d="M250 300 L 118 112"/>
  </g>
  <text x="444" y="162" font-size="20" fill="#33445a">B</text>
  <!-- path 1: A then B (ochre) -->
  <g stroke="#8a5410" stroke-width="1.4" stroke-dasharray="3 4" fill="none">
    <path d="M340 144 L 340 300"/>
    <path d="M340 300 L 310.4 257.7"/>
  </g>
  <path d="M250 300 L 310.4 257.7" stroke="#8a5410" stroke-width="5" stroke-linecap="round"/>
  <!-- path 2: B then A (teal) -->
  <g stroke="#0b6466" stroke-width="1.4" stroke-dasharray="3 4" fill="none">
    <path d="M340 144 L 383.6 206.4"/>
    <path d="M383.6 206.4 L 383.6 300"/>
  </g>
  <path d="M250 304 L 383.6 304" stroke="#0b6466" stroke-width="5" stroke-linecap="round"/>
  <!-- belief state psi -->
  <path d="M250 300 L 340 144" stroke="#0e1b2c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="340" cy="144" r="5" fill="#0e1b2c"/>
  <text x="348" y="134" font-size="24" font-style="italic" fill="#0e1b2c">ψ</text>
  <circle cx="250" cy="300" r="4" fill="#0e1b2c"/>
  <!-- legend -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#33445a">
    <path d="M60 372 H 92" stroke="#8a5410" stroke-width="5" stroke-linecap="round"/>
    <text x="102" y="377">ask A, then B</text>
    <path d="M60 402 H 92" stroke="#0b6466" stroke-width="5" stroke-linecap="round"/>
    <text x="102" y="407">ask B, then A</text>
    <text x="300" y="377">Same belief, same questions,</text>
    <text x="300" y="397">different order, different result.</text>
  </g>
</svg>
